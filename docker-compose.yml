services:
  postgres:
    image: postgres:15-alpine
    container_name: blog_postgres
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blogdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blogdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog_app
    environment:
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: bloguser
      DB_PASSWORD: postgres
      DB_NAME: blogdb
      DB_SSLMODE: disable

      JWT_SECRET: our-secret-key-change-in-production
      JWT_EXPIRY_HOURS: "2"

      APP_ENV: development
      LOG_LEVEL: debug

      CACHE_TTL_MINUTES: "5"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: blog_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: